# Only your changes live here; everything else comes from yazi's built-in defaults.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_dir_first = true
show_hidden    = false
scrolloff      = 5

# Default applications come from XDG (see `xdg-pick`) instead of hardcoded vim/vlc.
# xdg-run --here: terminal apps (e.g. vim) run inside yazi's terminal, GUI apps are detached.
[opener]
xdg = [
	{ run = 'xdg-run --here %s', desc = "Default app (XDG)", block = true },
]

[open]
prepend_rules = [
	{ mime = "text/*",                                     use = [ "xdg", "reveal" ] },
	{ mime = "application/{json,ndjson,javascript}",       use = [ "xdg", "reveal" ] },
	{ mime = "inode/empty",                                use = [ "xdg", "reveal" ] },
	{ mime = "image/*",                                    use = [ "xdg", "reveal" ] },
	{ mime = "{audio,video}/*",                            use = [ "xdg", "reveal" ] },
	{ mime = "application/pdf",                            use = [ "xdg", "reveal" ] },
]
