# ---- borders / titlebars ----
default_border pixel 2
default_floating_border pixel 2
title_align center
titlebar_border_thickness 2
titlebar_padding 4 2

# ---- gaps ----
gaps inner 6
gaps outer 0

# ---- behaviour ----
workspace_layout default
mouse_warping none
seat * hide_cursor 5000
focus_follows_mouse no
focus_wrapping no

# class                 border    background text  indicator  child_border
client.focused          $cyan     $cyan      $bg    $magenta   $cyan
client.focused_inactive $dim      $surface   $fg    $dim       $dim
client.unfocused        $surface  $bg        $dim   $surface   $surface
client.urgent           $magenta  $magenta   $bg    $magenta   $magenta
client.placeholder      $bg       $bg        $dim   $bg        $bg
client.background       $bg
