# ---- palette (cyberpunk, shared with foot/waybar/rofi/mako/swaylock) ----
set $bg       #0a0a12
set $surface  #12121f
set $fg       #d0d8f0
set $dim      #5c6384
set $cyan     #00f0ff
set $magenta  #ff2a6d
set $yellow   #fcee0a

# ---- modifier and vim-style direction keys ----
set $mod Mod4
set $left h
set $down j
set $up k
set $right l

# ---- programs: resolved through XDG defaults, change them with `xdg-pick` ----
set $bin ~/.local/bin
set $term    $bin/xdg-launch terminal
set $browser $bin/xdg-launch browser
set $files   $bin/xdg-launch files
# rofi needs ~/.local/bin in PATH so that its "terminal" option (xdg-term) is found
set $menu env PATH=$HOME/.local/bin:$PATH rofi -show drun
