# Pipewire, wireplumber, portals, ssh-agent: one sequential script (no races, no double restarts)
exec ~/.config/sway/scripts/session-services.sh

# monitor profiles (restarted on every reload so config changes are picked up)
exec_always ~/.config/sway/scripts/kanshi.sh

# notifications
exec mako

# runit user services (syncthing)
exec runsvdir $HOME/.service

# lock after 15 min, screens off after 30, lock before suspend
exec swayidle -w \
    timeout 900 'swaylock -f' \
    timeout 1800 'swaymsg "output * power off"' \
        resume 'swaymsg "output * power on"' \
    before-sleep 'swaylock -f'

# wallpaper
output * bg ~/Pictures/wallpapers/pinguini.jpg fill

# bar
bar {
    swaybar_command waybar
}
