#----------------------always-on----------------------

exec_always /usr/bin/swaync
#----------------Idle configuration--------------------------
#
exec swayidle -w \
	timeout 900 'swaylock -f' \
	timeout 1805 'swaymsg "output * power off"' \
		resume 'swaymsg "output * power on"' \
	before-sleep 'swaylock -f'
for_window [app_id=".*"] inhibit_idle fullscreen
for_window [class=".*"] inhibit_idle fullscreen
#
# This will lock your screen after 900 seconds(15 minutes) of inactivity, then turn off
# your displays after another 900 seconds, and turn your screens back on when
# resumed. It will also lock your screen before your computer goes to sleep.

#############wallpaper#################
# Default wallpaper (more resolutions are available in /usr/share/backgrounds/sway/)
output * bg ~/Pictures/wallpapers/pinguini.jpg fill

exec killall -q wireplumber pipewire-pulse pipewire xdg-desktop-portal-wlr xdg-desktop-portal; true
exec dbus-update-activation-environment --all
exec sleep 1 && pipewire
exec sleep 2 && pipewire-pulse
exec sleep 3 && wireplumber
exec sleep 5 && /usr/libexec/xdg-desktop-portal-wlr
exec sleep 6 && /usr/libexec/xdg-desktop-portal

bar {
    swaybar_command waybar
}
# Aggiorna D-Bus con le variabili di Sway appena il compositor è pronto
exec dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

# Riavvia il portale per forzarlo a leggere le variabili aggiornate
exec_always pkill xdg-desktop-portal; /usr/libexec/xdg-desktop-portal &

#segue kanshi per la gestione dei profili della gestione dei monitor
exec_always "killall kanshi; kanshi"

# servizio syncthing
exec runsvdir /home/steppasecca/.service

#avvio dell'aggente ssh nella sessione corrente
exec ssh-agent -a "$XDG_RUNTIME_DIR/ssh-agent.socket"
exec export SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/ssh-agent.socket"
