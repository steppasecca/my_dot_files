#----------------------always-on----------------------

bar {
    swaybar_command waybar
}
exec_always /usr/bin/swaync
#----------------Idle configuration--------------------------
#
exec swayidle -w \
	timeout 900 'swaylock -f' \
	timeout 1805 'swaymsg "output * power off"' \
		resume 'swaymsg "output * power on"' \
	before-sleep 'swaylock -f'
#
# This will lock your screen after 900 seconds(15 minutes) of inactivity, then turn off
# your displays after another 900 seconds, and turn your screens back on when
# resumed. It will also lock your screen before your computer goes to sleep.
#############wallpaper#################
# Default wallpaper (more resolutions are available in /usr/share/backgrounds/sway/)
output * bg ~/Pictures/wallpapers/pinguini.jpg fill

# --- AVVIO SERVIZI AUDIO/VIDEO ---

# 1. Aggiorna l'ambiente D-Bus
exec dbus-update-activation-environment --all

# 2. Uccidi eventuali residui
exec killall -q pipewire wireplumber pipewire-pulse xdg-desktop-portal-wlr xdg-desktop-portal

# 3. Avvia la suite PipeWire (Audio + Video)
exec pipewire &
exec pipewire-pulse &
exec wireplumber &

# 4. Avvia i portali per Telegram/Firefox (dopo un breve delay)
exec sleep 2 && /usr/libexec/xdg-desktop-portal-wlr &
exec sleep 3 && /usr/libexec/xdg-desktop-portal &
